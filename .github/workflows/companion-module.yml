name: Build Bitfocus Companion Module

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-module:
    name: Package Companion Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'bitfocus/package.json'

      - name: Set module version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION=$(node -p "require('./bitfocus/package.json').version || '1.0.0'")
          fi
          echo "MODULE_VERSION=$VERSION" >> $GITHUB_ENV
          npm --prefix bitfocus version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "
            const fs = require('fs');
            const file = './bitfocus/companion/manifest.json';
            const m = JSON.parse(fs.readFileSync(file, 'utf8'));
            m.version = '$VERSION';
            fs.writeFileSync(file, JSON.stringify(m, null, 2) + '\n');
          "

      - name: Install dependencies
        working-directory: bitfocus
        run: npm install

      - name: Build official Companion package
        working-directory: bitfocus
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dante-streamer-${{ env.MODULE_VERSION }}
          path: bitfocus/*.tgz
          retention-days: 30
