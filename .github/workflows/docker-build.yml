name: Build & Publish Dante Streamer Container

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: npetersendk/golang-inferno-player

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Test & Lint Go Stream Engine
  #
  # Runs alongside the image builds rather than gating them, so it costs no wall
  # clock. Publishing the multi-arch manifest still waits for it, so a failing
  # test never becomes a tagged release.
  # ----------------------------------------------------------------------------
  test-go:
    name: Test Go Web Player
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go compilation
        run: |
          go vet ./...
          go build -v ./...

      - name: Run unit tests
        run: go test ./...

  # ----------------------------------------------------------------------------
  # Job 2: Build Architectures in Parallel on Separate Runners
  # ----------------------------------------------------------------------------
  build-arch:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Only the Debian runtime stage executes target-architecture commands;
      # the Go and Rust builds are cross-compiled on the build platform.
      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform-specific tag suffix
        id: platform-tag
        run: |
          PLATFORM_PAIR="${{ matrix.platform }}"
          ARCH="${PLATFORM_PAIR#*/}"
          echo "arch=${ARCH}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Platform Image by Digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/streamer/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Registry cache rather than type=gha. GitHub's Actions cache is scoped
          # per ref, and this workflow only runs on tags, so a cache written
          # while building v1.0.0 is invisible when building v1.0.1 - every
          # release recompiled the Inferno ALSA module from scratch. A registry
          # cache is shared by all runs. It is only an optimisation: if the
          # cache tag is missing or stale the build still succeeds, just slower.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ steps.platform-tag.outputs.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ steps.platform-tag.outputs.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform-tag.outputs.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Job 3: Merge Architecture Manifests into Single Multi-Arch Image
  # ----------------------------------------------------------------------------
  merge-manifests:
    name: Merge & Publish Multi-Arch Manifest
    needs: [build-arch, test-go]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS+=( "-t" "$tag" )
          done <<< "$TAGS"

          DIGEST_ARGS=()
          for f in *; do
            DIGEST_ARGS+=( "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:$f" )
          done

          echo "Creating manifest for tags: ${TAG_ARGS[*]}"
          echo "Using digests: ${DIGEST_ARGS[*]}"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${DIGEST_ARGS[@]}"

      - name: Inspect final multi-arch image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} || true
