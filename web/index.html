<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dante Streamer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" crossorigin="anonymous"/>
  <link href="/style.css" rel="stylesheet"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom px-3 py-2">
    <div class="container-fluid p-0">
      <a class="navbar-brand d-flex align-items-center gap-2 mb-0" href="#">
        <i class="fa-solid fa-tower-broadcast text-danger"></i>
        <span class="fw-bold">Dante Streamer</span>
      </a>

      <div class="d-flex align-items-center gap-2 flex-wrap ms-auto">
        <span class="status-pill status-pill-online" id="clockPill">
          <i class="fa-solid fa-clock"></i> <span id="clockStatusText">PTP Locked (48kHz)</span>
        </span>

        <span class="status-pill status-pill-info" id="devicePill">
          <i class="fa-solid fa-network-wired"></i> <span id="danteDeviceText">Dante-Pi</span>
        </span>

        <button id="stopAllBtn" class="btn btn-sm btn-outline-danger" title="Stop playback on all zones">
          <i class="fa-solid fa-stop"></i> Stop All
        </button>

        <button id="openCustomModalBtn" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#customUrlModal">
          <i class="fa-solid fa-plus"></i> Custom URL
        </button>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <div class="container-fluid py-3 px-3">
    <div class="row g-3">

      <!-- LEFT COLUMN: DANTE OUTPUT ZONES -->
      <div class="col-lg-5 col-xl-4">
        <div class="card h-100 shadow-sm border">
          <div class="card-header bg-body-tertiary d-flex justify-content-between align-items-center py-2">
            <h6 class="mb-0 fw-semibold text-body-secondary">
              <i class="fa-solid fa-sliders me-1"></i> Output Zones
            </h6>
            <span class="badge text-bg-secondary" id="activeZonesCount">0 Active</span>
          </div>

          <!-- Only rendered when the tuner feature is enabled -->
          <div id="tunerPanel" hidden></div>

          <div class="card-body p-2" id="zonesList">
            <!-- Dynamically populated zone cards -->
            <div class="text-center text-muted py-4" id="zonesPlaceholder">
              <i class="fa-solid fa-spinner fa-spin me-2"></i> Connecting to Dante engine...
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN: STATIONS & STREAMS BROWSER -->
      <div class="col-lg-7 col-xl-8">
        <div class="card h-100 shadow-sm border">
          <div class="card-header bg-body-tertiary py-2">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
              <h6 class="mb-0 fw-semibold text-body-secondary">
                <i class="fa-solid fa-radio me-1"></i> Radio Stations & Audio Streams
              </h6>
              <div class="d-flex align-items-center gap-2">
                <span class="small text-muted text-nowrap">Play to:</span>
                <select id="targetZoneSelect" class="form-select form-select-sm" style="min-width: 140px;">
                  <option value="1">Zone 1</option>
                </select>
              </div>
            </div>

            <!-- Search & Filters -->
            <div class="input-group input-group-sm mb-2">
              <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
              <input type="text" id="stationSearchInput" class="form-control" placeholder="Search station name or description..."/>
            </div>

            <!-- Dynamic Category Pills from YAML -->
            <ul class="nav nav-pills nav-pills-sm gap-1" id="categoryNav">
              <!-- Dynamically populated tabs -->
            </ul>
          </div>

          <div class="card-body p-3">
            <div class="row g-2" id="stationsGrid">
              <!-- Dynamically populated station cards -->
              <div class="col-12 text-center text-muted py-5">
                <i class="fa-solid fa-spinner fa-spin me-2"></i> Loading stations...
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- CUSTOM URL MODAL -->
  <div class="modal fade" id="customUrlModal" tabindex="-1" aria-labelledby="customUrlModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content border shadow">
        <div class="modal-header py-2">
          <h6 class="modal-title fw-semibold" id="customUrlModalLabel">
            <i class="fa-solid fa-link me-1"></i> Stream Custom Audio URL
          </h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="customStreamForm">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label small text-muted">Target Zone</label>
              <select id="modalZoneSelect" class="form-select form-select-sm">
                <!-- Dynamically populated -->
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">Stream URL (HLS / AAC / MP3 / Icecast)</label>
              <input type="url" id="customUrlInput" class="form-control form-control-sm" placeholder="https://stream.example.com/live.m3u8" required/>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">Display Name (Optional)</label>
              <input type="text" id="customNameInput" class="form-control form-control-sm" placeholder="My Custom Stream"/>
            </div>
          </div>
          <div class="modal-footer py-2">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-sm btn-primary">
              <i class="fa-solid fa-play me-1"></i> Play Stream
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="/app.js"></script>
</body>
</html>
