<!DOCTYPE html>
<html lang="en" data-theme="gray">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dante Streamer</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet"/>
  <link href="/design.css" rel="stylesheet"/>
  <link href="/style.css" rel="stylesheet"/>
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="brand row" href="#"><i class="fa-solid fa-tower-broadcast" style="color:var(--err)"></i><span>Dante Streamer</span></a>
    <span class="spacer"></span>
    <div class="toolbar">
      <span class="badge ok" id="clockPill"><i class="fa-solid fa-clock"></i> <span id="clockStatusText">PTP Locked (48kHz)</span></span>
      <span class="badge info" id="devicePill"><i class="fa-solid fa-network-wired"></i> <span id="danteDeviceText">Dante-Pi</span></span>
      <button id="stopAllBtn" class="btn sm ghost danger" title="Stop playback on all zones"><i class="fa-solid fa-stop"></i> Stop All</button>
      <button id="openCustomModalBtn" class="btn sm" type="button"><i class="fa-solid fa-plus"></i> Custom URL</button>
      <span class="badge muted" id="versionBadge">{{VERSION}}</span>
    </div>
  </header>

  <main class="content">
    <div class="stack">
      <div class="layout">

        <section class="card">
          <div class="row">
            <h3><i class="fa-solid fa-sliders"></i> Output Zones</h3>
            <span class="spacer"></span>
            <span class="badge muted" id="activeZonesCount">0 Active</span>
          </div>
          <div id="zonesList" class="stack" style="gap:8px">
            <div class="empty" id="zonesPlaceholder">
              <i class="fa-solid fa-spinner fa-spin"></i> Connecting to Dante engine...
            </div>
          </div>
        </section>

        <section class="card">
          <div class="toolbar">
            <div class="tabs grow" id="sourceTabs" style="border-bottom:0">
              <button class="tab on" data-panel="radio"><i class="fa-solid fa-radio"></i> Internet Radio</button>
              <button class="tab" id="tabFm" data-panel="fm" hidden><i class="fa-solid fa-tower-broadcast"></i> Radio</button>
              <button class="tab" id="tabSoundboard" data-panel="soundboard" hidden><i class="fa-solid fa-grip"></i> Soundboard</button>
            </div>
            <span class="muted small nowrap">Play to:</span>
            <select id="targetZoneSelect" style="min-width:140px">
              <option value="1">Zone 1</option>
            </select>
          </div>

          <div id="panel-radio" class="stack" style="gap:12px">
            <div class="row">
              <i class="fa-solid fa-magnifying-glass muted"></i>
              <input type="text" id="stationSearchInput" class="grow" placeholder="Search station name or description..."/>
            </div>

            <div class="chips" id="categoryNav"></div>

            <div class="station-grid" id="stationsGrid">
              <div class="empty">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading stations...
              </div>
            </div>
          </div>

          <!-- Filled by app.js only when the tuner feature is enabled -->
          <div id="panel-fm" class="stack" style="gap:12px" hidden></div>

          <div id="panel-soundboard" class="stack" style="gap:12px" hidden>
            <div class="toolbar">
              <i class="fa-solid fa-magnifying-glass muted"></i>
              <input type="text" id="soundSearchInput" class="search" placeholder="Search sounds..."/>
              <span class="spacer"></span>
              <button id="stopSoundsBtn" class="btn sm ghost danger"><i class="fa-solid fa-stop"></i> Stop All Sounds</button>
            </div>

            <div id="soundboardMsg" class="alert warn small" hidden></div>

            <div id="playingSounds"></div>

            <div class="sound-grid" id="soundsGrid"></div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <footer class="footer muted">A project by NPetersen - <a href="https://github.com/NPetersenDK"><i class="fa-brands fa-github"></i> NPetersenDK</a> - <a href="https://nipetersen.dk">nipetersen.dk</a></footer>

</div>

<dialog class="modal wide" id="customUrlModal" aria-labelledby="customUrlModalLabel">
  <div class="row">
    <h2 id="customUrlModalLabel" style="font-size:16px"><i class="fa-solid fa-link"></i> Stream Custom Audio URL</h2>
    <span class="spacer"></span>
    <form method="dialog"><button class="btn sm ghost" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></form>
  </div>
  <form id="customStreamForm" class="stack" style="gap:14px">
    <label>Target Zone
      <select id="modalZoneSelect"></select>
    </label>
    <label>Stream URL (HLS / AAC / MP3 / Icecast)
      <input type="url" id="customUrlInput" placeholder="https://stream.example.com/live.m3u8" required/>
    </label>
    <label>Display Name (Optional)
      <input type="text" id="customNameInput" placeholder="My Custom Stream"/>
    </label>
    <div class="row" style="justify-content:flex-end">
      <button type="button" class="btn" id="customCancelBtn">Cancel</button>
      <button type="submit" class="btn primary"><i class="fa-solid fa-play"></i> Play Stream</button>
    </div>
  </form>
</dialog>

<script src="/design.js"></script>
<script src="/app.js"></script>
</body>
</html>
