# ==============================================================================
# Dante Audio Hub - Example Configuration
# Copy this file to config.yaml and customize for your setup:
#   cp config.example.yaml config.yaml
# ==============================================================================

# Dante Device Name (advertised in Dante Controller)
dante_name: "Dante-Pi"

# Web Management Interface Port
http_port: 8085

# Native Dante Sample Rate (standard is 48000 Hz)
sample_rate: 48000

# Directory for audio FIFO pipes (internal)
pipe_dir: "/tmp/dante_player"

# ------------------------------------------------------------------------------
# Dante Output Zones (maps each zone to Dante TX channel pairs)
# ------------------------------------------------------------------------------
zones:
  - id: 1
    name: "Zone 1 (Living Room)"
    dante_left: "Zone 1 L (Ch 1)"
    dante_right: "Zone 1 R (Ch 2)"
    pipe_path: "/tmp/dante_player/zone_1.pcm"

  - id: 2
    name: "Zone 2 (Kitchen)"
    dante_left: "Zone 2 L (Ch 3)"
    dante_right: "Zone 2 R (Ch 4)"
    pipe_path: "/tmp/dante_player/zone_2.pcm"

  - id: 3
    name: "Zone 3 (Office)"
    dante_left: "Zone 3 L (Ch 5)"
    dante_right: "Zone 3 R (Ch 6)"
    pipe_path: "/tmp/dante_player/zone_3.pcm"

  - id: 4
    name: "Zone 4 (Balcony / Workshop)"
    dante_left: "Zone 4 L (Ch 7)"
    dante_right: "Zone 4 R (Ch 8)"
    pipe_path: "/tmp/dante_player/zone_4.pcm"

  # ----------------------------------------------------------------------------
  # Optional: dedicate a zone to an external producer instead of the station
  # browser. Add a "source" block and the zone attaches to that FIFO at startup
  # and stays there: it drops out of the station target list, Stop All leaves it
  # alone, and its Dante channel pair becomes a permanent feed.
  #
  # The engine only knows how to read raw PCM from a FIFO. What writes to it is
  # up to you - librespot for Spotify Connect, shairport-sync for AirPlay, or
  # anything else. Omit the block entirely and nothing about the zone changes.
  #
  # For Spotify, docker/compose.spotify.yml is a complete stack that runs the
  # producer alongside the streamer; use it instead of docker/compose.yml.
  #
  - id: 4
    name: "Spotify"
    dante_left: "Spotify L (Ch 7)"
    dante_right: "Spotify R (Ch 8)"
    source:
      type: pipe
      path: "/tmp/dante_player/spotify.pcm"
      label: "Spotify"
      # Raw PCM the producer writes. These defaults match librespot's pipe
      # backend; FFmpeg resamples to the 48 kHz Dante clock.
      format: s16le
      sample_rate: 44100
      channels: 2
      # A local producer is far steadier than an internet stream, so a source
      # zone can buffer much less and stay responsive. Defaults to 1000 ms.
      prebuffer_ms: 300
      # buffer_ms caps the queue and is what sets the latency you hear. The
      # producer is held back by backpressure rather than paced by a network,
      # so it keeps the queue full - the cap is the steady state, not the
      # prebuffer. It also decides how much already-queued audio must drain
      # before a track change in the app reaches the speakers. Defaults to
      # twice prebuffer_ms. Lower it if the producer feels laggy, raise it if
      # you hear dropouts.
      #
      # DANTE_SOURCE_PREBUFFER_MS and DANTE_SOURCE_BUFFER_MS override both for
      # every source zone, so they can be tuned from the compose file without
      # editing a mounted config.
      buffer_ms: 600
  # ----------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Optional: RTL-SDR tuner feeding one source zone.
#
# Disabled by default - with enabled false nothing starts, no API is served and
# the UI shows nothing. zone_id must name a zone whose source is a realtime pipe
# at the path the tuner writes to:
#
#   - id: 3
#     name: "Radio"
#     dante_left: "Radio L (Ch 5)"
#     dante_right: "Radio R (Ch 6)"
#     source:
#       type: pipe
#       path: "/tmp/dante_player/radio.pcm"
#       label: "Radio"
#       realtime: true      # an SDR cannot be paused, so never block it
#       channels: 1         # rtl_fm is mono; FFmpeg upmixes to stereo
#       sample_rate: 48000
#
# One dongle tunes one frequency at a time. Retuning restarts the receiver, so
# the zone goes quiet for a moment and comes back on its own.
# ------------------------------------------------------------------------------
# Find the device with:  docker exec dante-streamer rtl_test -t
# It prints e.g.  0:  Realtek, RTL2838UHIDIR, SN: 00000001
# rtl_fm prints the same list every time it starts, so it also appears in the
# container log under [Tuner].
#
# "device" takes an index or a serial, matched exactly or by prefix or suffix.
# Prefer the serial: indices shift when USB devices come and go. Give a dongle
# its own serial with:  rtl_eeprom -d 0 -s dante-fm
# ------------------------------------------------------------------------------
# tuner:
#   enabled: false
#   zone_id: 3
#   device: "0"           # or a serial, e.g. "dante-fm"
#   gain: "auto"
#   squelch: 0            # nonzero gates the audio, for scanner use
#   presets:
#     # In hertz, not megahertz: 96.4 MHz is 96400000, eight digits. The UI's
#     # manual field takes megahertz instead, so 96.4 there.
#     - id: "p4-trekanten"
#       name: "P4 Trekanten"
#       frequency_hz: 96400000

