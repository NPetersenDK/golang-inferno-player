# ==============================================================================
# Dante Audio Hub - Example Configuration
# Copy this file to config.yaml and customize for your setup:
#   cp config.example.yaml config.yaml
# ==============================================================================

# Dante Device Name (advertised in Dante Controller)
dante_name: "Dante-Pi"

# Web Management Interface Port
http_port: 8085

# Native Dante Sample Rate (standard is 48000 Hz)
sample_rate: 48000

# Directory for audio FIFO pipes (internal)
pipe_dir: "/tmp/dante_player"

# ------------------------------------------------------------------------------
# Dante Output Zones (maps each zone to Dante TX channel pairs)
# ------------------------------------------------------------------------------
zones:
  - id: 1
    name: "Zone 1 (Living Room)"
    dante_left: "Zone 1 L (Ch 1)"
    dante_right: "Zone 1 R (Ch 2)"
    pipe_path: "/tmp/dante_player/zone_1.pcm"

  - id: 2
    name: "Zone 2 (Kitchen)"
    dante_left: "Zone 2 L (Ch 3)"
    dante_right: "Zone 2 R (Ch 4)"
    pipe_path: "/tmp/dante_player/zone_2.pcm"

  - id: 3
    name: "Zone 3 (Office)"
    dante_left: "Zone 3 L (Ch 5)"
    dante_right: "Zone 3 R (Ch 6)"
    pipe_path: "/tmp/dante_player/zone_3.pcm"

  - id: 4
    name: "Zone 4 (Balcony / Workshop)"
    dante_left: "Zone 4 L (Ch 7)"
    dante_right: "Zone 4 R (Ch 8)"
    pipe_path: "/tmp/dante_player/zone_4.pcm"

# ------------------------------------------------------------------------------
