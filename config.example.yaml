# Example configuration:  cp config.example.yaml config.yaml

# The name shown in Dante Controller.
dante_name: "Dante-Pi"

http_port: 8085

# 48000 is the Dante standard; other rates need every device on the network to agree.
sample_rate: 48000

pipe_dir: "/tmp/dante_player"

# Each zone takes one Dante TX channel pair.
zones:
  - id: 1
    name: "Zone 1 (Living Room)"
    dante_left: "Zone 1 L (Ch 1)"
    dante_right: "Zone 1 R (Ch 2)"
    pipe_path: "/tmp/dante_player/zone_1.pcm"

  - id: 2
    name: "Zone 2 (Kitchen)"
    dante_left: "Zone 2 L (Ch 3)"
    dante_right: "Zone 2 R (Ch 4)"
    pipe_path: "/tmp/dante_player/zone_2.pcm"

  - id: 3
    name: "Zone 3 (Office)"
    dante_left: "Zone 3 L (Ch 5)"
    dante_right: "Zone 3 R (Ch 6)"
    pipe_path: "/tmp/dante_player/zone_3.pcm"

  - id: 4
    name: "Zone 4 (Balcony / Workshop)"
    dante_left: "Zone 4 L (Ch 7)"
    dante_right: "Zone 4 R (Ch 8)"
    pipe_path: "/tmp/dante_player/zone_4.pcm"

  # Optional: a "source" block locks the zone to an external producer for good.
  # It leaves the station target list and Stop All ignores it. The engine only
  # reads raw PCM from a FIFO; anything can write it (librespot, shairport-sync).
  # For Spotify, docker/compose.spotify.yml runs the producer for you.
  - id: 4
    name: "Spotify"
    dante_left: "Spotify L (Ch 7)"
    dante_right: "Spotify R (Ch 8)"
    source:
      type: pipe
      path: "/tmp/dante_player/spotify.pcm"
      label: "Spotify"
      # Must match what the producer actually writes; these suit librespot's pipe
      # backend. FFmpeg resamples to the 48 kHz Dante clock.
      format: s16le
      sample_rate: 44100
      channels: 2
      # A local producer is steadier than an internet stream, so it can buffer
      # far less than the 1000 ms default.
      prebuffer_ms: 300
      # buffer_ms caps the queue, and since backpressure keeps it full it is the
      # latency you actually hear, including the lag before a track change
      # reaches the speakers. Defaults to twice prebuffer_ms. Lower if laggy,
      # raise if you hear dropouts. DANTE_SOURCE_PREBUFFER_MS and
      # DANTE_SOURCE_BUFFER_MS override both from the compose file.
      buffer_ms: 600

# Optional: RTL-SDR tuner feeding one source zone. With enabled false nothing
# starts and no API is served. zone_id must name a zone whose source is a
# realtime pipe at the path the tuner writes to:
#
#   - id: 3
#     name: "Radio"
#     dante_left: "Radio L (Ch 5)"
#     dante_right: "Radio R (Ch 6)"
#     source:
#       type: pipe
#       path: "/tmp/dante_player/radio.pcm"
#       label: "Radio"
#       realtime: true      # an SDR cannot be paused, so never block it
#       format: s16le
#       # Must match rtl_fm's own "Output at N Hz." line, which differs between
#       # builds. A mismatch just sounds like a bad signal, so the tuner logs
#       # RATE MISMATCH instead.
#       sample_rate: 170000
#       channels: 1         # mono; FFmpeg upmixes to stereo
#
# Retuning restarts the receiver, so the zone goes quiet for a moment.
#
# List dongles with:  docker exec dante-streamer rtl_test -t
# Prefer a serial over an index - indices shift when USB devices come and go.
# Set one with:  rtl_eeprom -d 0 -s dante-fm
# tuner:
#   enabled: false
#   zone_id: 3
#   device: "0"           # or a serial, e.g. "dante-fm"
#   gain: "auto"          # or dB as a number, e.g. "28.0"
#   squelch: 0            # nonzero gates the audio, for scanner use
#   presets:
#     # In hertz, not megahertz: 96.4 MHz is 96400000, eight digits. The UI's
#     # manual field takes megahertz instead, so 96.4 there.
#     - id: "p4-trekanten"
#       name: "P4 Trekanten"
#       frequency_hz: 96400000

# Soundboard: every audio file in the directory becomes a pad, re-read as you go
# so new files need no restart. Pads layer on top of the zone rather than
# replacing it. Source zones cannot be targeted. On by default.
# soundboard:
#   enabled: true
#   path: "./data/sounds"   # defaults to a "sounds" folder under data_dir
#   max_seconds: 60         # decoded pads are held in RAM, so long files are refused

stations:
