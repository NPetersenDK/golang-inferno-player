# Run from the repository root:
#   docker compose -f docker/compose.yml up -d
# For a Spotify Connect source, use compose.spotify.yml instead.

services:
  dante-streamer:
    image: ghcr.io/npetersendk/golang-inferno-player:latest
    container_name: dante-streamer
    restart: unless-stopped
    # Host network for the Dante NIC, multicast and PTP.
    network_mode: host
    environment:
      # The NIC dedicated to Dante (eth1, usb0, enx..., end0, ...)
      - DANTE_INTERFACE=eth1
      - INFERNO_NAME=Dante-Pi
      # 2/4/6/8, two per zone.
      - DANTE_TX_CHANNELS=8
      - HTTP_PORT=8085
    cap_add:
      # No SYS_TIME: the PTP listener serves a clock overlay, it does not set the
      # system clock.
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    ulimits:
      rtprio: 95
      memlock: -1
    # Uncomment both for an RTL-SDR source. Grant only the dongle's bus (lsusb),
    # resolved at container start, so a replugged dongle needs a restart.
    # environment:
    #   - DANTE_TUNER_ENABLED=1
    # devices:
    #   - /dev/bus/usb/001:/dev/bus/usb/001
    volumes:
      # Path is relative to this file, not your shell. A bind source that does
      # not exist becomes a directory instead of an error, so check typos here.
      - ${DANTE_CONFIG:-./config.yaml}:/opt/dante-player/config.yaml:ro
      # Soundboard pads; drop this line to switch the soundboard off.
      - ./sounds:/opt/dante-player/data/sounds
      # Keeps Dante Controller routing across restarts.
      - dante_state:/root/.local/state/inferno_aoip
      - /dev/shm:/dev/shm

volumes:
  dante_state:
    name: dante_pi_state
