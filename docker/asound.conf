# Upstream Inferno Dante ALSA Configuration
# Provides multi-channel Dante virtual soundcard with persistent routing

pcm.inferno {
    type inferno
    NAME "Dante-Pi"
    TX_CHANNELS 8
    RX_CHANNELS 0
    SAMPLE_RATE 48000
    TX_LATENCY_NS 10000000
}

ctl.inferno {
    type inferno
}

# 4 Stereo Output Zones bound to the 8 Dante TX Channels
pcm.dante_zone1 {
    type plug
    slave.pcm {
        type dshare
        ipc_key 5678293
        slave {
            pcm "inferno"
            channels 8
            rate 48000
        }
        bindings {
            0 0
            1 1
        }
    }
}

pcm.dante_zone2 {
    type plug
    slave.pcm {
        type dshare
        ipc_key 5678293
        slave {
            pcm "inferno"
            channels 8
            rate 48000
        }
        bindings {
            0 2
            1 3
        }
    }
}

pcm.dante_zone3 {
