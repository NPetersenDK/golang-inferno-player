# Use INSTEAD of compose.yml:
#   docker compose -f docker/compose.spotify.yml up -d
# Requires a zone with a matching source block in config.yaml.

services:
  dante-streamer:
    image: ghcr.io/npetersendk/golang-inferno-player:latest
    container_name: dante-streamer
    restart: unless-stopped
    network_mode: host
    environment:
      - DANTE_INTERFACE=eth1
      - INFERNO_NAME=Dante-Pi
      # 2/4/6/8, two per zone.
      - DANTE_TX_CHANNELS=8
      - HTTP_PORT=8085
      # Lower is snappier; too low shows up as [Audio Health] holes in the log.
      - DANTE_SOURCE_PREBUFFER_MS=150
      - DANTE_SOURCE_BUFFER_MS=300
      # - DANTE_ALSA_BUFFER_US=250000   # ALSA playback buffer, all zones
      # - DANTE_FIFO_BYTES=16384        # kernel buffer behind a source FIFO
    cap_add:
      # No SYS_TIME: the PTP listener serves a clock overlay, it does not set the
      # system clock.
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    ulimits:
      rtprio: 95
      memlock: -1
    volumes:
      # Path is relative to this file, not your shell. A bind source that does
      # not exist becomes a directory instead of an error, so check typos here.
      - ${DANTE_CONFIG:-./config.yaml}:/opt/dante-player/config.yaml:ro
      # Soundboard pads; drop this line to switch the soundboard off.
      - ./sounds:/opt/dante-player/data/sounds
      - dante_state:/root/.local/state/inferno_aoip
      - /dev/shm:/dev/shm
      # Carries the librespot FIFO between the two containers.
      - dante_pipes:/tmp/dante_player

  librespot:
    image: ghcr.io/npetersendk/dante-librespot:latest
    container_name: dante-librespot
    restart: unless-stopped
    # Host network so Spotify Connect is discoverable from the LAN.
    network_mode: host
    depends_on:
      - dante-streamer
    volumes:
      - dante_pipes:/tmp/dante_player
      # This librespot has only the Avahi zeroconf backend, so discovery needs
      # the host's Avahi daemon over D-Bus.
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
    # List form, not a folded string: argv must reach librespot exactly. Without
    # --device the pipe backend writes to stdout and tracks skip instantly.
    command:
      - --name
      - Dante-Pi
      - --backend
      - pipe
      - --device
      - /tmp/dante_player/spotify.pcm
      - --bitrate
      - "320"
      - --volume-ctrl
      - log
      - --initial-volume
      - "60"
      - --disable-gapless

volumes:
  dante_state:
    name: dante_pi_state
  dante_pipes:
    name: dante_pi_pipes
